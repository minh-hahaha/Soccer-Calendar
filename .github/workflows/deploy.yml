on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: football-ai-api
  ECS_SERVICE: football-ai-service
  ECS_CLUSTER: football-ai-cluster
  ECS_TASK_DEFINITION: football-ai-task

permissions:
  contents: read

jobs:
  # Skip tests for now since no test suite yet

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build Docker image with correct platform for ECS Fargate
        docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        # Also tag and push as latest
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Download current task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition $ECS_TASK_DEFINITION \
          --query taskDefinition > task-definition.json

    - name: Update task definition with new image
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: football-ai-container
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    - name: Wait for deployment to stabilize
      run: |
        echo "Waiting for service to reach stable state..."
        aws ecs wait services-stable \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE \
          --region $AWS_REGION

    - name: Get application URL
      id: get-url
      run: |
        ALB_DNS=$(aws elbv2 describe-load-balancers \
          --names football-ai-alb \
          --query 'LoadBalancers[0].DNSName' \
          --output text 2>/dev/null || echo "ALB not found")
        echo "url=http://$ALB_DNS" >> $GITHUB_OUTPUT
        echo "ALB DNS: $ALB_DNS"

    - name: Verify deployment health
      run: |
        echo "Testing deployment health..."
        sleep 30  # Give the service time to fully start
        
        # Test health endpoint
        if curl -f -m 30 "${{ steps.get-url.outputs.url }}/health/quick"; then
          echo "✅ Health check passed"
        else
          echo "⚠️ Health check failed - service may still be starting"
        fi

    - name: Show deployment info
      run: |
        echo "🎉 Deployment completed!"
        echo "📊 Application URL: ${{ steps.get-url.outputs.url }}"
        echo "📚 API Documentation: ${{ steps.get-url.outputs.url }}/docs"
        echo ""
        echo "Service status:"
        aws ecs describe-services \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE \
          --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,TaskDefinition:taskDefinition}' \
          --output table
   # Optional: Run pipeline after successful deployment
  run-pipeline:
    name: Run Data Pipeline
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'  # Only run on main branch
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Run data pipeline
      run: |
        echo "Starting data pipeline..."
        
        # Get subnet and security group from secrets (you'll need to add these)
        SUBNET_ID="${{ secrets.PUBLIC_SUBNET_ID }}"
        SECURITY_GROUP="${{ secrets.ECS_SG_ID }}"
        
        if [ -z "$SUBNET_ID" ] || [ -z "$SECURITY_GROUP" ]; then
          echo "⚠️ Missing subnet or security group secrets - skipping pipeline"
          echo "Add PUBLIC_SUBNET_ID and ECS_SG_ID to GitHub secrets to enable pipeline"
          exit 0
        fi
        
        # Run the complete pipeline
        TASK_ARN=$(aws ecs run-task \
          --cluster $ECS_CLUSTER \
          --task-definition $ECS_TASK_DEFINITION \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
          --overrides '{"containerOverrides":[{"name":"football-ai-container","command":["python","scripts/run_pipeline.py","run-pipeline","--season","2025"]}]}' \
          --query 'tasks[0].taskArn' \
          --output text)
        
        echo "Pipeline task started: $TASK_ARN"
        echo "Monitor progress in ECS console or CloudWatch logs"